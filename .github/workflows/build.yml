name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.13113456" >> "$GITHUB_ENV"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/lockaim.jks" \
            -alias lockaim \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lockaim123 -keypass lockaim123 \
            -dname "CN=LockAim, OU=Dev, O=LockAim, L=NA, S=NA, C=IN"
          printf 'storeFile=%s\nstorePassword=lockaim123\nkeyAlias=lockaim\nkeyPassword=lockaim123\n' "$RUNNER_TEMP/lockaim.jks" > keystore.properties
          {
            echo "AIMBUDDY_KEYSTORE_FILE=$RUNNER_TEMP/lockaim.jks"
            echo "AIMBUDDY_KEYSTORE_PASSWORD=lockaim123"
            echo "AIMBUDDY_KEY_ALIAS=lockaim"
            echo "AIMBUDDY_KEY_PASSWORD=lockaim123"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -x lint -x lintVitalRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/LockAim-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Release APK, package com.aimbuddy.
          files: out/*.apk
